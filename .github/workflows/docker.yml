name: Build, Push, Deploy image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Docker Scout requires a Docker Hub login to call the Scout API
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Scan the exact image that was just pushed (ghcr requires lowercase names)
      - name: Set image reference
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"

      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          command: quickview,cves,recommendations
          image: registry://${{ env.IMAGE }}
          only-severities: critical,high
          exit-code: false # set to true to fail the pipeline on critical/high CVEs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Deploy to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$VM_USER@$VM_HOST" \
            'cd ~/weknowxd/WeKnowDocker && docker-compose pull && docker-compose up -d'
